# Render Blueprint: https://render.com/docs/blueprint-spec
# Values marked `sync: false` are asked for when the Blueprint is created.
services:
    - type: web
      name: ped
      runtime: docker
      plan: free
      branch: main
      autoDeploy: true
      healthCheckPath: /up
      envVars:
          - key: APP_NAME
            value: PED
          - key: APP_ENV
            value: production
          - key: APP_DEBUG
            value: 'false'
          - key: APP_KEY
            sync: false
          - key: APP_URL
            sync: false
          - key: LOG_CHANNEL
            value: stderr
          - key: DB_CONNECTION
            value: mysql
          - key: DB_HOST
            sync: false
          - key: DB_PORT
            sync: false
          - key: DB_DATABASE
            sync: false
          - key: DB_USERNAME
            sync: false
          - key: DB_PASSWORD
            sync: false
          - key: MYSQL_ATTR_SSL_CA
            value: /etc/secrets/aiven-ca.pem
          - key: SESSION_DRIVER
            value: database
          - key: CACHE_STORE
            value: database
          - key: QUEUE_CONNECTION
            value: sync
          - key: MAIL_MAILER
            value: resend
          - key: RESEND_API_KEY
            sync: false
          - key: MAIL_FROM_ADDRESS
            sync: false
          - key: MAIL_FROM_NAME
            value: Contentu PED
          - key: FILESYSTEM_DISK
            value: local
          - key: SEED_ADMIN_EMAIL
            sync: false
          - key: SEED_ADMIN_PASSWORD
            sync: false
